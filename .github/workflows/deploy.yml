name: Build and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/davboxhome/alsha-dawid-wedding

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install web preparation dependencies
        run: python -m pip install Pillow

      - name: Get Flutter packages
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Prepare Flutter web files
        run: python scripts/prepare_web.py

      - name: Build Flutter web
        run: >
          flutter build web
          --release
          --base-href '/'
          --dart-define=GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}

      - name: Stamp release
        run: echo "${GITHUB_SHA}" > build/web/release.txt

      - name: Verify web build
        run: |
          test -f build/web/index.html
          test -f build/web/main.dart.js
          test -f build/web/favicon.png
          test -f build/web/release.txt

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    needs: build
    runs-on:
      - self-hosted
      - linux
      - x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create stack directory
        run: mkdir -p /opt/stacks/alisha-dawid-wedding

      - name: Copy compose file
        run: |
          cp deploy/docker-compose.yml /opt/stacks/alisha-dawid-wedding/docker-compose.yml

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Pull latest image
        working-directory: /opt/stacks/alisha-dawid-wedding
        run: docker compose pull

      - name: Deploy
        working-directory: /opt/stacks/alisha-dawid-wedding
        run: docker compose up -d --remove-orphans --force-recreate

      - name: Verify deployment
        run: |
          sleep 3

          curl \
            --fail \
            --silent \
            --show-error \
            http://127.0.0.1:8083/ \
            > /dev/null

      - name: Verify deployed release
        run: |
          DEPLOYED_RELEASE="$(curl \
            --fail \
            --silent \
            --show-error \
            http://127.0.0.1:8083/release.txt)"

          echo "Expected release: ${GITHUB_SHA}"
          echo "Davbox release:  ${DEPLOYED_RELEASE}"

          if [ "${DEPLOYED_RELEASE}" != "${GITHUB_SHA}" ]; then
            echo "ERROR: Davbox is not serving the build from this deployment."
            exit 1
          fi

      - name: Purge Cloudflare cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          RESPONSE="$(curl \
            --fail \
            --silent \
            --show-error \
            --request POST \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{"purge_everything":true}')"

          echo "${RESPONSE}"

          if ! echo "${RESPONSE}" | grep -q '"success":true'; then
            echo "ERROR: Cloudflare cache purge failed."
            exit 1
          fi

      - name: Verify public release
        run: |
          for ATTEMPT in $(seq 1 12); do
            PUBLIC_RELEASE="$(curl \
              --fail \
              --silent \
              --show-error \
              "https://alisha-dawid-wedding.vip/release.txt?check=${GITHUB_SHA}" \
              || true)"

            echo "Attempt ${ATTEMPT}: ${PUBLIC_RELEASE}"

            if [ "${PUBLIC_RELEASE}" = "${GITHUB_SHA}" ]; then
              echo "Public website is serving the new release."
              exit 0
            fi

            sleep 5
          done

          echo "ERROR: Public website is not serving the new release."
          echo "Expected: ${GITHUB_SHA}"
          echo "Received: ${PUBLIC_RELEASE}"
          exit 1

      - name: Show status
        working-directory: /opt/stacks/alisha-dawid-wedding
        run: docker compose ps
