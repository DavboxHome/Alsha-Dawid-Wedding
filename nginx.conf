server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Always revalidate files before using a cached copy.
    # This prevents visitors getting an old Flutter build after a deployment.
    location / {
        try_files $uri $uri/ /index.html;

        expires -1;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
}