server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Flutter's app shell keeps stable filenames between releases.
    # Never let the browser keep an old app build for days.
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location = /main.dart.js {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location = /flutter_bootstrap.js {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location = /flutter_service_worker.js {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location ~* \.(js|mjs|wasm|json)$ {
        expires -1;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Static visual assets can still be cached normally.
    location ~* \.(css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf)$ {
        expires 7d;
        add_header Cache-Control "public" always;
        try_files $uri =404;
    }

    location / {
        expires -1;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
